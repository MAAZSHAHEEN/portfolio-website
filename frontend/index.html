<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static metadata is available before JavaScript or API requests run.
         See README.md for the deliberately limited content-rule exception. -->
    <title>Maaz Shaheen - Backend Developer</title>
    <meta
      name="description"
      content="Portfolio of Maaz Shaheen, a backend developer specializing in Python and FastAPI."
    />
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored
          try {
            stored = localStorage.getItem('portfolio-theme')
          } catch (e) {}
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
